<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Venus Flytrap Monitor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #pageLayout {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            flex-wrap: wrap;
        }

        #cameraContainer {
            position: relative;
            display: inline-block;
            overflow: hidden;
            user-select: none;
            border: 1px solid #ddd;
            vertical-align: top;
        }

        #preview {
            display: block;
            width: 640px;
            height: 480px;
        }

        #detailsPanel {
            flex: 1 1 320px;
            min-width: 280px;
            max-width: 500px;
        }

        .roi {
            position: absolute;
            width: 150px;
            height: 100px;
            border: 3px solid red;
            box-sizing: border-box;
            cursor: move;
        }

        .roi.selected {
            border-color: blue;
        }

        .roiLabel {
            position: absolute;
            left: 3px;
            top: 3px;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            font-size: 14px;
            pointer-events: none;
        }

        .resizeHandle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border: 2px solid blue;
            box-sizing: border-box;
            display: none;
        }

        .roi.selected .resizeHandle {
            display: block;
        }

        .resizeHandle.tl {
            left: -6px;
            top: -6px;
            cursor: nwse-resize;
        }

        .resizeHandle.tr {
            right: -6px;
            top: -6px;
            cursor: nesw-resize;
        }

        .resizeHandle.bl {
            left: -6px;
            bottom: -6px;
            cursor: nesw-resize;
        }

        .resizeHandle.br {
            right: -6px;
            bottom: -6px;
            cursor: nwse-resize;
        }

        #controls {
            position: static;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f5f5f5;
            padding: 6px;
            box-sizing: border-box;
            width: 100%;
        }

        button {
            padding: 8px 10px;
            margin: 0;
        }

        #statusPanel {
            margin-top: 20px;
            display: grid;
            gap: 8px;
            max-width: 640px;
        }

        .statusRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #d8d8d8;
            background: #f9f9f9;
            border-radius: 6px;
            padding: 8px 12px;
        }

        .statusRow.closed {
            background: #ffe5e5;
            border-color: #f3a0a0;
        }

        .statusRow.closing {
            background: #fff6e0;
            border-color: #f0cf7a;
        }

        .statusRow.open {
            background: #eaf9ee;
            border-color: #abd7b0;
        }

        .statusState {
            font-weight: bold;
        }

        #thresholdForm {
            margin-top: 20px;
            max-width: 640px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 12px;
            font-weight: bold;
        }

        .field input {
            padding: 8px;
            font-size: 14px;
        }

        #thresholdForm .sectionLabel {
            grid-column: 1 / -1;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        #eventsPanel {
            margin-top: 10px;
            display: grid;
            gap: 8px;
            max-width: 640px;
        }

        .eventRow {
            border: 1px solid #d8d8d8;
            background: #f9f9f9;
            border-radius: 6px;
            padding: 8px 12px;
        }

        .eventRow.active {
            background: #fff6e0;
            border-color: #f0cf7a;
        }

        .eventRow.finalized {
            background: #eaf9ee;
            border-color: #abd7b0;
        }

        .eventHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .eventTitle {
            font-weight: bold;
        }

        .eventState {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .eventMeta {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        .eventSegments {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .eventSegments a {
            font-size: 12px;
        }

        #eventsEmpty {
            color: #666;
            font-size: 13px;
        }

    </style>

</head>

<body>

<h1 id="pageTitle">Venus Flytrap Monitor <span id="batteryStatus">(battery --%)</span></h1>

<div id="pageLayout">
    <div id="cameraContainer">

        <img id="preview"
             src="/preview"
             width="640"
             height="480">

        <!-- ROI elements are created by JavaScript -->

        <div id="controls">

            <button id="zoomOutButton"
                    onclick="setZoomLevel(zoomLevel / 1.25)">
                Zoom Out
            </button>

            <button id="zoomInButton"
                    onclick="setZoomLevel(zoomLevel * 1.25)">
                Zoom In
            </button>

            <button onclick="addTrap()">
                Add Trap
            </button>

            <button onclick="deleteSelected()">
                Delete Selected
            </button>

            <button onclick="saveTraps()">
                Save
            </button>

        </div>

    </div>

    <div id="detailsPanel">
        <h2>Trap state</h2>
        <div id="statusPanel"></div>

        <h2>Recent events</h2>
        <div id="eventsPanel"></div>

        <h2>Detection thresholds</h2>
        <form id="thresholdForm" onsubmit="saveThresholds(event)">
            <div class="sectionLabel">Per-frame signal</div>
            <div class="field">
                <label for="baselineAdaptMeanDiffThreshold">Baseline adapt mean diff</label>
                <input id="baselineAdaptMeanDiffThreshold" type="number" step="0.1" min="0" />
            </div>
            <div class="field">
                <label for="cellChangeThreshold">Cell change threshold</label>
                <input id="cellChangeThreshold" type="number" step="0.5" min="0" />
            </div>
            <div class="field">
                <label for="closedMeanDiffThreshold">Trap closed mean diff</label>
                <input id="closedMeanDiffThreshold" type="number" step="0.5" min="0" />
            </div>
            <div class="field">
                <label for="closedChangedFractionThreshold">Closed changed fraction</label>
                <input id="closedChangedFractionThreshold" type="number" step="0.01" min="0" max="1" />
            </div>
            <div class="sectionLabel">Closing confirmation (hysteresis)</div>
            <div class="field">
                <label for="minClosingFrames">Min. consecutive frames</label>
                <input id="minClosingFrames" type="number" step="1" min="1" />
            </div>
            <div class="field">
                <label for="minClosingDurationMs">Min. duration (ms)</label>
                <input id="minClosingDurationMs" type="number" step="50" min="0" />
            </div>
            <button type="submit">Save thresholds</button>
        </form>
    </div>
</div>

<script>

    let nextTrapId = 1;
    let selectedRoi = null;

    /*
     * Zoom is restored from the Android application through
     * the X-Zoom response header from GET /traps.
     */
    let zoomLevel = 1;

    const MIN_WIDTH = 40;
    const MIN_HEIGHT = 30;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3.0;


    function updateZoomButtons() {

        const hasRois =
            document.querySelectorAll('.roi').length > 0;

        const zoomInButton =
            document.getElementById('zoomInButton');

        const zoomOutButton =
            document.getElementById('zoomOutButton');

        /*
         * ROIs lock the zoom, but do NOT reset the
         * currently selected zoom level.
         */
        zoomInButton.disabled =
            hasRois ||
            zoomLevel >= MAX_ZOOM;

        zoomOutButton.disabled =
            hasRois ||
            zoomLevel <= MIN_ZOOM;
    }


    function requestZoom(nextZoomLevel) {

        /*
         * Once an ROI exists, zoom is locked.
         */
        if (
            document.querySelectorAll('.roi').length > 0
        ) {
            return;
        }

        const clampedZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    nextZoomLevel
                )
            );

        fetch('/zoom', {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                zoom: clampedZoom
            })
        })

        .then(function(response) {

            if (!response.ok) {
                throw new Error(
                    'Server returned ' +
                    response.status
                );
            }

            return response.text();
        })

        .then(function() {

            zoomLevel = clampedZoom;

            updateZoomButtons();
        })

        .catch(function(error) {

            console.error(
                'Zoom request failed:',
                error
            );

            alert(
                'Zoom request failed: ' +
                error.message
            );
        });
    }


    function setZoomLevel(nextZoomLevel) {

        requestZoom(nextZoomLevel);
    }


    function getImageSize() {

        const preview =
            document.getElementById('preview');

        return {
            width: preview.clientWidth,
            height: preview.clientHeight
        };
    }


    function selectRoi(roi) {

        if (selectedRoi !== null) {

            selectedRoi.classList.remove(
                'selected'
            );
        }

        selectedRoi = roi;

        selectedRoi.classList.add(
            'selected'
        );
    }


    function makeDraggable(roi) {

        let dragging = false;

        let offsetX = 0;
        let offsetY = 0;


        roi.addEventListener(
            'mousedown',
            function(event) {

                if (
                    event.target.classList.contains(
                        'resizeHandle'
                    )
                ) {
                    return;
                }

                selectRoi(roi);

                dragging = true;

                offsetX =
                    event.clientX -
                    roi.offsetLeft;

                offsetY =
                    event.clientY -
                    roi.offsetTop;

                event.preventDefault();
            }
        );


        document.addEventListener(
            'mousemove',
            function(event) {

                if (!dragging) {
                    return;
                }

                const container =
                    document.getElementById(
                        'cameraContainer'
                    );

                const rect =
                    container.getBoundingClientRect();


                let x =
                    event.clientX -
                    rect.left -
                    offsetX;

                let y =
                    event.clientY -
                    rect.top -
                    offsetY;


                x = Math.max(
                    0,
                    Math.min(
                        x,
                        640 -
                        roi.offsetWidth
                    )
                );


                y = Math.max(
                    0,
                    Math.min(
                        y,
                        480 -
                        roi.offsetHeight
                    )
                );


                roi.style.left =
                    x + 'px';

                roi.style.top =
                    y + 'px';
            }
        );


        document.addEventListener(
            'mouseup',
            function() {

                dragging = false;
            }
        );
    }


    function makeResizable(roi) {

        const handles =
            roi.querySelectorAll(
                '.resizeHandle'
            );


        handles.forEach(
            function(handle) {

                handle.addEventListener(
                    'mousedown',
                    function(event) {

                        selectRoi(roi);

                        event.preventDefault();
                        event.stopPropagation();


                        const startX =
                            event.clientX;

                        const startY =
                            event.clientY;


                        const startLeft =
                            roi.offsetLeft;

                        const startTop =
                            roi.offsetTop;

                        const startWidth =
                            roi.offsetWidth;

                        const startHeight =
                            roi.offsetHeight;


                        function resize(event) {

                            const dx =
                                event.clientX -
                                startX;

                            const dy =
                                event.clientY -
                                startY;


                            let left =
                                startLeft;

                            let top =
                                startTop;

                            let width =
                                startWidth;

                            let height =
                                startHeight;


                            if (
                                handle.classList.contains(
                                    'tl'
                                )
                            ) {

                                left =
                                    startLeft +
                                    dx;

                                top =
                                    startTop +
                                    dy;

                                width =
                                    startWidth -
                                    dx;

                                height =
                                    startHeight -
                                    dy;
                            }


                            if (
                                handle.classList.contains(
                                    'tr'
                                )
                            ) {

                                top =
                                    startTop +
                                    dy;

                                width =
                                    startWidth +
                                    dx;

                                height =
                                    startHeight -
                                    dy;
                            }


                            if (
                                handle.classList.contains(
                                    'bl'
                                )
                            ) {

                                left =
                                    startLeft +
                                    dx;

                                width =
                                    startWidth -
                                    dx;

                                height =
                                    startHeight +
                                    dy;
                            }


                            if (
                                handle.classList.contains(
                                    'br'
                                )
                            ) {

                                width =
                                    startWidth +
                                    dx;

                                height =
                                    startHeight +
                                    dy;
                            }


                            if (
                                width <
                                MIN_WIDTH
                            ) {

                                if (
                                    handle.classList.contains(
                                        'tl'
                                    ) ||
                                    handle.classList.contains(
                                        'bl'
                                    )
                                ) {

                                    left =
                                        startLeft +
                                        startWidth -
                                        MIN_WIDTH;
                                }

                                width =
                                    MIN_WIDTH;
                            }


                            if (
                                height <
                                MIN_HEIGHT
                            ) {

                                if (
                                    handle.classList.contains(
                                        'tl'
                                    ) ||
                                    handle.classList.contains(
                                        'tr'
                                    )
                                ) {

                                    top =
                                        startTop +
                                        startHeight -
                                        MIN_HEIGHT;
                                }

                                height =
                                    MIN_HEIGHT;
                            }


                            left =
                                Math.max(
                                    0,
                                    left
                                );

                            top =
                                Math.max(
                                    0,
                                    top
                                );


                            width =
                                Math.min(
                                    width,
                                    640 - left
                                );

                            height =
                                Math.min(
                                    height,
                                    480 - top
                                );


                            roi.style.left =
                                left + 'px';

                            roi.style.top =
                                top + 'px';

                            roi.style.width =
                                width + 'px';

                            roi.style.height =
                                height + 'px';
                        }


                        function stopResize() {

                            document.removeEventListener(
                                'mousemove',
                                resize
                            );

                            document.removeEventListener(
                                'mouseup',
                                stopResize
                            );
                        }


                        document.addEventListener(
                            'mousemove',
                            resize
                        );

                        document.addEventListener(
                            'mouseup',
                            stopResize
                        );

                    }
                );

            }
        );
    }


    function renumberTraps() {

        const rois =
            document.querySelectorAll(
                '.roi'
            );


        rois.forEach(
            function(roi, index) {

                const label =
                    roi.querySelector(
                        '.roiLabel'
                    );

                if (label) {
                    label.textContent =
                        String(index + 1);
                }

                roi.dataset.id =
                    String(index + 1);
            }
        );
    }


    function createRoi(
        id,
        left,
        top,
        width,
        height
    ) {

        const container =
            document.getElementById(
                'cameraContainer'
            );


        const roi =
            document.createElement(
                'div'
            );


        roi.className =
            'roi';


        roi.dataset.id =
            id;


        roi.style.left =
            left + 'px';

        roi.style.top =
            top + 'px';

        roi.style.width =
            width + 'px';

        roi.style.height =
            height + 'px';


        roi.innerHTML =
            '<div class="roiLabel">1</div>' +

            '<div class="resizeHandle tl"></div>' +

            '<div class="resizeHandle tr"></div>' +

            '<div class="resizeHandle bl"></div>' +

            '<div class="resizeHandle br"></div>';


        container.appendChild(roi);


        makeDraggable(roi);

        makeResizable(roi);

        const label = roi.querySelector('.roiLabel');
        if (label) {
            label.textContent = String(id);
        }

        roi.addEventListener(
            'mousedown',
            function() {

                selectRoi(roi);
            }
        );


        return roi;
    }


    function addTrap() {

        createRoi(
            nextTrapId++,
            100,
            100,
            150,
            100
        );

        /*
         * Creating the first ROI locks the
         * current zoom level.
         *
         * It does NOT reset zoom to 1x.
         */
        updateZoomButtons();
    }


    function deleteSelected() {

        if (selectedRoi === null) {
            return;
        }


        selectedRoi.remove();

        selectedRoi = null;


        renumberTraps();

        updateZoomButtons();
    }

    function normalizeTrapIds() {
        renumberTraps();
        nextTrapId = document.querySelectorAll('.roi').length + 1;
    }

    function handleTrapKeyDelete(event) {
        const isDeleteKey =
            event.key === 'Delete' ||
            event.key === 'Del' ||
            event.code === 'Delete';

        if (!isDeleteKey || selectedRoi === null) {
            return;
        }

        event.preventDefault();
        deleteSelected();
    }

    function clearTrapRois() {
        const rois = document.querySelectorAll('.roi');
        rois.forEach(function(roi) {
            roi.remove();
        });
        selectedRoi = null;
        nextTrapId = 1;
    }


    function saveTraps() {

        const rois =
            document.querySelectorAll(
                '.roi'
            );


        const imageSize =
            getImageSize();


        const traps = [];
        const seenIds = new Set();

        renumberTraps();

        rois.forEach(
            function(roi) {

                const trapId = Number(
                    roi.dataset.id
                );

                if (seenIds.has(trapId)) {
                    return;
                }

                seenIds.add(trapId);

                traps.push({

                    id: trapId,

                    left:
                        roi.offsetLeft /
                        imageSize.width,

                    top:
                        roi.offsetTop /
                        imageSize.height,

                    width:
                        roi.offsetWidth /
                        imageSize.width,

                    height:
                        roi.offsetHeight /
                        imageSize.height
                });
            }
        );


        fetch('/traps', {

            method: 'POST',

            headers: {
                'Content-Type':
                    'application/json'
            },

            body:
                JSON.stringify(traps)

        })

        .then(
            function(response) {

                if (!response.ok) {

                    throw new Error(
                        'Server returned ' +
                        response.status
                    );
                }

                return response.text();
            }
        )

        .then(
            function(message) {

                normalizeTrapIds();
                loadTraps();
                loadStatus();
                alert(message);
            }
        )

        .catch(
            function(error) {

                console.error(error);

                alert(
                    'Failed to save traps: ' +
                    error.message
                );
            }
        );
    }


    function renderBattery(level) {
        const batteryStatus = document.getElementById('batteryStatus');
        if (!batteryStatus) {
            return;
        }

        const pct = Number(level || 0);
        batteryStatus.textContent = '(battery ' + pct + '%)';
    }

    function loadBattery() {
        fetch('/battery')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Server returned ' + response.status);
                }
                return response.json();
            })
            .then(function(payload) {
                renderBattery(payload.level);
            })
            .catch(function(error) {
                console.error('Failed to load battery level:', error);
            });
    }

    /*
     * Maps a trap's server-reported state to the CSS class and label used
     * in the status panel. Falls back to the legacy "closed" boolean for
     * compatibility if an older server build doesn't send "state" yet.
     */
    function classifyTrapState(trap) {

        if (trap.state === 'CLOSED' || trap.state === 'CLOSING' || trap.state === 'OPEN') {
            return trap.state;
        }

        return trap.closed ? 'CLOSED' : 'OPEN';
    }

    function renderStatus(statusResponse) {

        const panel = document.getElementById('statusPanel');

        if (!statusResponse || !Array.isArray(statusResponse.traps)) {
            panel.innerHTML = '<div class="statusRow open"><div>Waiting for trap dataג€¦</div></div>';
            return;
        }

        if (statusResponse.traps.length === 0) {
            panel.innerHTML = '<div class="statusRow open"><div>No traps configured</div></div>';
            return;
        }

        const rows = statusResponse.traps.map(function(trap) {

            const state = classifyTrapState(trap);
            const rowClass = state.toLowerCase();
            const meanDiff = Number(trap.meanDiff || 0).toFixed(1);
            const changedFraction = Number(trap.changedFraction || 0).toFixed(2);

            return '<div class="statusRow ' + rowClass + '">' +
                '<div>Trap ' + trap.id + '</div>' +
                '<div class="statusState">' + state + '</div>' +
                '<div>־”=' + meanDiff + '</div>' +
                '<div>Changed=' + changedFraction + '</div>' +
                '</div>';
        });

        panel.innerHTML = rows.join('');
    }

    function loadStatus() {
        fetch('/status')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Server returned ' + response.status);
                }
                return response.json();
            })
            .then(function(payload) {
                renderStatus(payload);
            })
            .catch(function(error) {
                console.error('Failed to load trap status:', error);
            });
    }

    /*
     * Formats an eventId like "trap2_20260918_143012" into a short,
     * readable label. Falls back to the raw eventId if it doesn't match
     * the expected pattern.
     */
    function formatEventLabel(eventId) {

        const match = /^trap(\d+)_(\d{8})_(\d{6})$/.exec(eventId || '');

        if (!match) {
            return eventId;
        }

        const trapId = match[1];
        const datePart = match[2];
        const timePart = match[3];

        const year = datePart.slice(0, 4);
        const month = datePart.slice(4, 6);
        const day = datePart.slice(6, 8);

        const hour = timePart.slice(0, 2);
        const minute = timePart.slice(2, 4);
        const second = timePart.slice(4, 6);

        return 'Trap ' + trapId + ' — ' +
            year + '-' + month + '-' + day + ' ' +
            hour + ':' + minute + ':' + second;
    }

    function renderEvents(events) {

        const panel = document.getElementById('eventsPanel');

        if (!Array.isArray(events)) {
            panel.innerHTML = '<div id="eventsEmpty">Failed to load events.</div>';
            return;
        }

        if (events.length === 0) {
            panel.innerHTML = '<div id="eventsEmpty">No events recorded yet.</div>';
            return;
        }

        const rows = events.map(function(event) {

            const finalized = event.finalized === true;
            const rowClass = finalized ? 'finalized' : 'active';
            const label = formatEventLabel(event.eventId);

            let metaHtml = '';
            let segmentsHtml = '';

            if (finalized && event.metadata) {

                const segments = Array.isArray(event.metadata.segments) ? event.metadata.segments : [];

                metaHtml = '<div class="eventMeta">' + segments.length + ' segment(s)' + '</div>';

                segmentsHtml = '<div class="eventSegments">';

                segments.forEach(function(fileName) {
                    const url = '/events/' + encodeURIComponent(event.eventId) + '/' + encodeURIComponent(fileName);
                    const escEventId = event.eventId.replace(/'/g, "\\'" );
                    const escFileName = fileName.replace(/'/g, "\\'");
                    segmentsHtml += '<div style="display:inline-flex;align-items:center;gap:6px;margin-right:6px;">' +
                        '<a href="' + url + '" target="_blank">' + fileName + '</a>' +
                        '<button onclick="deleteEventFile(\'' + escEventId + '\', \'" + escFileName + "\')">Delete</button>' +
                        '</div>';
                });

                segmentsHtml += '</div>';

            } else {

                const segmentCount = Number(event.segmentCount || 0);
                metaHtml = '<div class="eventMeta">Recording — ' + segmentCount + ' segment(s) so far</div>';
            }

            const escEvent = event.eventId.replace(/'/g, "\\'");
            const deleteBtn = '<button style="margin-left:8px;" onclick="deleteEvent(\'' + escEvent + '\')">Delete Event</button>';

            return '<div class="eventRow ' + rowClass + '">' +
                '<div class="eventHeader">' +
                '<div class="eventTitle">' + label + '</div>' +
                '<div class="eventState">' + (finalized ? 'Finalized' : 'Recording') + deleteBtn + '</div>' +
                '</div>' +
                metaHtml +
                segmentsHtml +
                '</div>';
        });

        panel.innerHTML = rows.join('');
    }

    function deleteEvent(eventId) {
        if (!confirm('Delete event ' + eventId + '?')) return;
        fetch('/events/' + encodeURIComponent(eventId), { method: 'DELETE' })
            .then(function(response) {
                if (!response.ok) throw new Error('Server returned ' + response.status);
                return response.text();
            })
            .then(function() { loadEvents(); })
            .catch(function(error) { console.error('Failed to delete event:', error); alert('Failed to delete event: ' + error.message); });
    }

    function deleteEventFile(eventId, fileName) {
        if (!confirm('Delete file ' + fileName + ' from ' + eventId + '?')) return;
        fetch('/events/' + encodeURIComponent(eventId) + '/' + encodeURIComponent(fileName), { method: 'DELETE' })
            .then(function(response) {
                if (!response.ok) throw new Error('Server returned ' + response.status);
                return response.text();
            })
            .then(function() { loadEvents(); })
            .catch(function(error) { console.error('Failed to delete file:', error); alert('Failed to delete file: ' + error.message); });
    }

    function loadEvents() {
        fetch('/events')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Server returned ' + response.status);
                }
                return response.json();
            })
            .then(function(events) {
                renderEvents(events);
            })
            .catch(function(error) {
                console.error('Failed to load events:', error);
            });
    }

    function loadThresholds() {

        fetch('/thresholds')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Server returned ' + response.status);
                }
                return response.json();
            })
            .then(function(thresholds) {
                document.getElementById('baselineAdaptMeanDiffThreshold').value = thresholds.baselineAdaptMeanDiffThreshold;
                document.getElementById('cellChangeThreshold').value = thresholds.cellChangeThreshold;
                document.getElementById('closedMeanDiffThreshold').value = thresholds.closedMeanDiffThreshold;
                document.getElementById('closedChangedFractionThreshold').value = thresholds.closedChangedFractionThreshold;
                document.getElementById('minClosingFrames').value =
                    thresholds.minClosingFrames !== undefined ? thresholds.minClosingFrames : 5;
                document.getElementById('minClosingDurationMs').value =
                    thresholds.minClosingDurationMs !== undefined ? thresholds.minClosingDurationMs : 800;
            })
            .catch(function(error) {
                console.error('Failed to load thresholds:', error);
            });
    }

    function saveThresholds(event) {

        if (event) {
            event.preventDefault();
        }

        const payload = {
            baselineAdaptMeanDiffThreshold: Number(document.getElementById('baselineAdaptMeanDiffThreshold').value),
            cellChangeThreshold: Number(document.getElementById('cellChangeThreshold').value),
            closedMeanDiffThreshold: Number(document.getElementById('closedMeanDiffThreshold').value),
            closedChangedFractionThreshold: Number(document.getElementById('closedChangedFractionThreshold').value),
            minClosingFrames: Number(document.getElementById('minClosingFrames').value),
            minClosingDurationMs: Number(document.getElementById('minClosingDurationMs').value)
        };

        fetch('/thresholds', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Server returned ' + response.status);
            }
            return response.text();
        })
        .then(function(message) {
            alert(message);
            loadThresholds();
            loadStatus();
        })
        .catch(function(error) {
            console.error('Failed to save thresholds:', error);
            alert('Failed to save thresholds: ' + error.message);
        });
    }

    function loadTraps() {

        clearTrapRois();

        fetch('/traps')

        .then(
            function(response) {

                if (!response.ok) {

                    throw new Error(
                        'Server returned ' +
                        response.status
                    );
                }


                /*
                 * Android sends the persisted zoom
                 * in the X-Zoom response header.
                 */
                const savedZoom =
                    parseFloat(
                        response.headers.get(
                            'X-Zoom'
                        )
                    );


                if (
                    !isNaN(savedZoom)
                ) {

                    zoomLevel =
                        Math.max(
                            MIN_ZOOM,
                            Math.min(
                                MAX_ZOOM,
                                savedZoom
                            )
                        );
                }


                return response.json();
            }
        )

        .then(
            function(traps) {

                const imageSize =
                    getImageSize();


                let maxId = 0;


                traps.forEach(
                    function(trap) {

                        const roi =
                            createRoi(

                                trap.id,

                                trap.left *
                                    imageSize.width,

                                trap.top *
                                    imageSize.height,

                                trap.width *
                                    imageSize.width,

                                trap.height *
                                    imageSize.height
                            );


                        if (
                            trap.id >
                            maxId
                        ) {

                            maxId =
                                trap.id;
                        }
                    }
                );


                nextTrapId =
                    maxId + 1;

                if (traps.length === 0) {
                    clearTrapRois();
                }


                if (
                    traps.length === 0
                ) {

                    addTrap();
                }


                /*
                 * If saved ROIs exist, the restored
                 * zoom remains unchanged and the
                 * zoom controls become locked.
                 */
                updateZoomButtons();

            }
        )

        .catch(
            function(error) {

                console.error(
                    'Failed to load traps:',
                    error
                );

                addTrap();
            }
        );
    }


    /*
     * Load persisted ROIs and zoom when the
     * browser page starts.
     */
    document.addEventListener('keydown', handleTrapKeyDelete);

    loadThresholds();
    loadTraps();
    loadStatus();
    loadBattery();
    loadEvents();

    updateZoomButtons();


    /*
     * Refresh the low-FPS JPEG preview.
     */
    setInterval(
        function() {

            document.getElementById(
                'preview'
            ).src =
                '/preview?t=' +
                Date.now();

        },
        300
    );

    setInterval(loadStatus, 1000);
    setInterval(loadBattery, 15000);
    setInterval(loadEvents, 5000);

</script>

</body>

</html>
